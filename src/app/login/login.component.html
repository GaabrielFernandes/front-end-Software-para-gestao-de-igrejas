<div class="login-wrapper">
  <div class="login-card">

    <!-- LADO DO FORMULÁRIO -->
    <div class="login-form-side">
      <div class="login-content">
        <header class="login-header">
          <div class="logo-box">
            <i class="pi pi-home"></i>
          </div>
          <h1 class="login-title">Acessar Sistema</h1>

        </header>

        <form [formGroup]="formulario" (ngSubmit)="enviarCredenciais()">
          <div class="form-container">

            <div class="field-box">
              <p-float-label>
                <input id="email" formControlName="email" pInputText class="w-full" autocomplete="username" />
                <label for="email">E-mail</label>
              </p-float-label>
            </div>

            <div class="field-box">
              <p-float-label>
                <p-password id="senha" formControlName="senha" [toggleMask]="true" [feedback]="false" styleClass="w-full" [fluid]="true" />
                <label for="senha">Senha</label>
              </p-float-label>
<!--              <div class="field-utils">-->
<!--                <a class="forgot-password">Esqueceu a senha?</a>-->
<!--              </div>-->
            </div>

            <button type="submit" class="btn-login-action" [disabled]="formulario.invalid">
              Entrar <i class="pi pi-arrow-right"></i>
            </button>
          </div>
        </form>

        <footer class="login-footer">
<!--          <p>&copy; 2026 Gestão para Igrejas • <span class="version">v1.0.4</span></p>-->
        </footer>
      </div>
    </div>

    <!-- LADO DA IMAGEM -->
    <div class="login-image-side">
      <div class="image-overlay">
        <div class="quote-container">
        </div>
      </div>
    </div>

  </div>
</div>
