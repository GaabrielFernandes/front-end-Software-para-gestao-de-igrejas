<div class="container">
  <div class="card main-card">
    <div class="table-actions">
      <app-btn-cadastrar
        label="Cadastrar Diretor"
        routerLink="/diretores/cadastrar">
      </app-btn-cadastrar>
    </div>

    <p-table
      [value]="diretor"
      [paginator]="true"
      [rows]="tamanhoPagina"
      [totalRecords]="totalRegistros"
      [lazy]="true"
      (onLazyLoad)="onPageChange($event)"
      [responsiveLayout]="'stack'"
      [rowsPerPageOptions]="[5, 10, 20]"
      styleClass="p-datatable-striped"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="id" style="width:13%"  class="text-xs"><p-sortIcon field="id"/> Código</th>
          <th pSortableColumn="nomeCompleto"  style="width:30%" class="text-xs"><p-sortIcon field="nomeCompleto"/>Nome</th>
          <th pSortableColumn="dataBatismo"  style="width:20%" class="text-xs"><p-sortIcon field="dataBatismo"/>Email</th>
          <th pSortableColumn="dataAdmissao"  style="width:20%" class="text-xs"><p-sortIcon field="dataAdmissao"/>Departamento</th>
          <th style="width:8%"  class="text-xs">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-diretor>
        <tr>
          <td class="text-xs">{{ diretor.id }}</td>
          <td class="text-xs">{{ diretor.nome }}</td>
          <td class="text-xs">{{ diretor.email}}</td>
          <td class="text-xs">{{ diretor.departamento}}</td>
          <td class="text-xs"><p-menu #menu [model]="items" [popup]="true" appendTo="body"></p-menu>
            <p-button
              (onClick)="abrirMenu(menu, $event, diretor)"
              icon="pi pi-ellipsis-v"
              [text]="true"
              severity="secondary">
            </p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
