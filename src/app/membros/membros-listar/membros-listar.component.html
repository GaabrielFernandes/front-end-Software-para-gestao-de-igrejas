<div class="container">
  <!-- Card Principal que envolve Título + Ações + Tabela -->
  <div class="main-surface">

    <!-- Cabeçalho da Seção -->
    <div class="section-header">
      <div class="title-wrapper">
        <div class="icon-box">
          <i class="pi pi-users"></i> <!-- Ícone que remete a membros -->
        </div>
        <div>
          <h1 class="main-title">Gestão de Membros</h1>
          <p class="main-subtitle">Visualize e gerencie o cadastro de todos os membros da instituição.</p>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" routerLink="/membros/cadastrar" class="btn btn-salvar">
          <i class="pi pi-plus-circle"></i>
          Novo Membro
        </button>
      </div>
    </div>

    <hr class="divider">
    <!-- Tabela Customizada -->
    <p-table
      [value]="membros"
      [paginator]="true"
      [rows]="tamanhoPagina"
      [totalRecords]="totalRegistros"
      [lazy]="true"
      (onLazyLoad)="onPageChange($event)"
      [rowsPerPageOptions]="[5, 10, 20]"
      styleClass="p-datatable-sm custom-table"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="id" style="width:10%">ID</th>
          <th pSortableColumn="nomeCompleto" style="width:40%">NOME COMPLETO</th>
          <th pSortableColumn="dataBatismo" style="width:20%">BATISMO</th>
          <th pSortableColumn="dataAdmissao" style="width:20%">ADMISSÃO</th>
          <th style="width:10%" class="text-center">GESTÃO</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-membro>
        <tr>
          <td data-label="ID"><span class="id-tag">#{{ membro.id }}</span></td>
          <td data-label="Nome">
            <span class="member-name">{{ membro.nomeCompleto }}</span>
          </td>
          <td data-label="Batismo">{{ membro.dataBatismo | date:'dd/MM/yyyy' }}</td>
          <td data-label="Admissao">{{ membro.dataAdmissao | date:'dd/MM/yyyy' }}</td>
          <td data-label="Gestao" class="text-center">
            <p-menu #menu [model]="items" [popup]="true" appendTo="body"></p-menu>
            <button class="btn-dots" (click)="abrirMenu(menu, $event, membro)">
              <i class="pi pi-ellipsis-h"></i>
            </button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
